# MolmoAct2 LoRA fine-tuning on RoboEval (absolute EE-pose actions).
# Fields follow LeRobot's TrainPipelineConfig, except two handled by train.py:
#   gpus:        GPUs to train on (one DDP process per GPU)
#   output_root: the run is written to <output_root>/<job_name>

job_name: molmoact2_roboeval_test_Oct2
output_root: /home/hongrui/nas/outputs
gpus: [1, 2]

steps: &steps 10000
batch_size: 16
num_workers: 4
log_freq: 20
env_eval_freq: -1
save_checkpoint: true
save_freq: 2500

dataset:
  repo_id: roboeval_lerobot_ee
  root: /home/hongrui/nas/dataset/roboeval_lerobot_ee
  video_backend: pyav
  image_transforms:
    enable: true

policy:
  type: molmoact2
  checkpoint_path: allenai/MolmoAct2
  device: cuda
  push_to_hub: false
  train_mode_vlm: lora
  action_mode: both
  chunk_size: 10
  n_action_steps: 10
  dtype: bfloat16
  num_flow_timesteps: 8
  gradient_checkpointing: true
  freeze_embedding: true
  normalize_gripper: false
  enable_knowledge_insulation: false
  setup_type: bimanual franka robotic arms in roboeval
  control_mode: absolute end-effector pose
  image_keys:
    - observation.images.head
    - observation.images.left_wrist
    - observation.images.right_wrist
  scheduler_decay_steps: *steps  # cosine LR decays over the whole run

accelerator:
  mixed_precision: bf16

wandb:
  enable: true
  project: molmoact2_roboeval
  disable_artifact: true
