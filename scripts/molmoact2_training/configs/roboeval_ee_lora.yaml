job_name: molmoact2_roboeval_all_Oct7
output_root: /home/hongrui/nas/outputs
gpus: [0, 4]

steps: &steps 30000
batch_size: 16
num_workers: 4
log_freq: 20
env_eval_freq: -1
save_checkpoint: true
save_freq: 5000

dataset:
  repo_id: roboeval_lerobot_ee
  root: /home/hongrui/nas/dataset/roboeval_lerobot_ee
  # RoboEval task variants to train on (e.g. [LiftPotOrientation, CubeHandover]); [] = all 32.
  tasks: []
  video_backend: pyav
  image_transforms:
    enable: true

policy:
  type: molmoact2
  checkpoint_path: allenai/MolmoAct2
  device: cuda
  push_to_hub: false
  train_mode_vlm: lora
  action_mode: both
  chunk_size: 10
  n_action_steps: 10
  dtype: bfloat16
  num_flow_timesteps: 8
  gradient_checkpointing: true
  freeze_embedding: true
  normalize_gripper: false
  enable_knowledge_insulation: false
  setup_type: bimanual franka robotic arms in roboeval
  control_mode: absolute end-effector pose
  image_keys:
    - observation.images.head
    - observation.images.left_wrist
    - observation.images.right_wrist
  scheduler_decay_steps: *steps  # cosine LR decays over the whole run

accelerator:
  mixed_precision: bf16
  ddp:
    gradient_as_bucket_view: true  # grads live in DDP's comm buckets: saves ~2.7 GB/GPU

wandb:
  enable: true
  project: molmoact2_roboeval
  disable_artifact: true
